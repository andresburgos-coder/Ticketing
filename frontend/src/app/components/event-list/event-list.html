<!-- Hero Section -->
<div class="w-full bg-white">
  <div class="flex min-h-[320px] md:min-h-[400px] flex-col gap-6 bg-cover bg-center bg-no-repeat items-center justify-center p-4 relative"
    style='background-image: linear-gradient(rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.6) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBfv1DJV6l20wimFths3YtOd7Pk64C3NoN78VUe3nKZRbimciyU62FH_0sJ6AOUEw23vUMIjxC9mVHuJgDd7wm1OIf4vMY0oDzZOqUBBWxF3yZs24udQexXnXQ4qLQXbyBrpW7Y5SehrfrXf3elrEX9-Pn3dsLTu3f75scXvKVEw8s65uCsZqhdQ2M_ZnrCspPWA5l3O9awVYy1poyZDVEwL1WKlJK5mmG5XD-Xbyth5hoP5h3fXHq2R8gRal4V1xyhs0n281ht7D7R");'>
    <div class="flex flex-col gap-3 text-center max-w-2xl z-10">
      <h1 class="text-white text-4xl font-black leading-tight tracking-[-0.033em] md:text-5xl lg:text-6xl">
        Discover Trending Events
      </h1>
      <p class="text-white/90 text-sm font-normal leading-normal md:text-lg">
        Find the best concerts, workshops, and gatherings near you.
      </p>
    </div>
  </div>
</div>

<!-- Main Content Area -->
<div class="max-w-[1440px] mx-auto w-full px-4 md:px-10 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
      <!-- Filters Sidebar -->
      <aside class="w-full lg:w-64 shrink-0 flex flex-col gap-6">
        <div class="lg:sticky lg:top-24">
          <app-event-filters></app-event-filters>
        </div>
      </aside>

      <!-- Events Grid -->
      <main class="flex-1">
        @if (isLoading()) {
          <div class="flex justify-center py-20">
            <app-loading-spinner size="lg" message="Loading events..."></app-loading-spinner>
          </div>
        } @else {
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            @for (event of events(); track event.id) {
              <app-event-card [event]="event"></app-event-card>
            } @empty {
            <p class="text-gray-500 col-span-3 text-center py-10">No events found.</p>
            }
          </div>
        }
      </main>
    </div>
</div>
