<div class="w-full bg-white">
  <div class="relative flex flex-col items-center justify-center mx-auto overflow-hidden" style="width:1400px; height:400px;">
    <div class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat z-0"
      [style.background-image]="'linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.6)), url(' + slides[current()]?.image + ')'">
    </div>
    <!-- Swiper Controls -->
    <div class="absolute bottom-6 left-0 right-0 flex justify-center items-center gap-4 z-20">
      <button aria-label="Anterior" (click)="prev()" class="w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center hover:bg-primary-600 transition-colors">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div class="flex gap-2">
        <ng-container *ngFor="let slide of slides; let i = index">
          <button aria-label="Ir al slide {{i+1}}" (click)="goTo(i)" [class.bg-primary-600]="current() === i" class="w-3 h-3 rounded-full bg-white/70 border border-white focus:outline-none focus:ring-2 focus:ring-primary-600 transition-all"></button>
        </ng-container>
      </div>
      <button aria-label="Siguiente" (click)="next()" class="w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center hover:bg-primary-600 transition-colors">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </div>
</div>
