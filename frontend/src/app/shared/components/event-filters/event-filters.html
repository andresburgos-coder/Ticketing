<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between lg:mb-4">
    <h2 class="text-[#111118] text-xl font-bold">Filtros</h2>
    <button
      (click)="clearFilters()"
      class="text-xs font-semibold text-primary-600 hover:text-primary-700 transition-colors"
    >
      Limpiar todo
    </button>
  </div>

  <div class="flex flex-col gap-6 bg-white p-5 rounded-xl border border-[#e5e7eb] shadow-sm">
    <!-- Search Input -->
    <div>
      <label for="search" class="block text-sm font-semibold text-gray-900 mb-3">
        Buscar eventos
      </label>
      <input
        id="search"
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="applyFilters()"
        placeholder="Nombre del evento..."
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none text-sm"
      />
    </div>

    <!-- Location Filter -->
    <div>
      <label for="location" class="block text-sm font-semibold text-gray-900 mb-3">
        Ubicación
      </label>
      <input
        id="location"
        type="text"
        [(ngModel)]="location"
        (ngModelChange)="applyFilters()"
        placeholder="Ciudad o recinto..."
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none text-sm"
      />
    </div>

    <!-- Category Filter -->
    <div>
      <label for="category" class="block text-sm font-semibold text-gray-900 mb-3">
        Categoría
      </label>
      <select
        id="category"
        [(ngModel)]="selectedCategory"
        (ngModelChange)="applyFilters()"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none text-sm"
      >
        @for (cat of categories; track cat) {
          <option [value]="cat === 'All Categories' ? '' : cat">{{ cat }}</option>
        }
      </select>
    </div>
  </div>
</div>
