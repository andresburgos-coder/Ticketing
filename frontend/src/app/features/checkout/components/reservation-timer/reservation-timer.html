<div [class]="isExpired ? 'bg-red-50 border border-red-200 rounded-lg p-4' : 'bg-amber-50 border border-amber-200 rounded-lg p-4'">
  <div class="flex items-center gap-3">
    <span [class]="isExpired ? 'material-symbols-outlined text-red-600 text-lg' : 'material-symbols-outlined text-amber-600 text-lg'">
      {{ isExpired ? 'timer_off' : 'schedule' }}
    </span>
    <div>
      @if (isExpired) {
        <p class="text-sm font-semibold text-red-900">¡Reserva expirada!</p>
        <p class="text-sm text-red-700">Tu tiempo se ha agotado</p>
      } @else {
        <p class="text-sm font-semibold text-amber-900">La reserva caduca en</p>
        <p class="text-lg font-bold text-amber-700">{{ displayTime }}</p>
      }
    </div>
  </div>
</div>
