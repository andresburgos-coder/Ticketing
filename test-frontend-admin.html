<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Admin Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .log { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Frontend Admin Dashboard Test</h1>
    
    <div class="test-section info">
        <h3>Instructions</h3>
        <ol>
            <li>Click "Login as Admin" to authenticate</li>
            <li>Open <a href="http://localhost:4200/admin" target="_blank">http://localhost:4200/admin</a> in a new tab</li>
            <li>Check if the admin dashboard loads and navigation works</li>
        </ol>
    </div>

    <div class="test-section">
        <h3>Controls</h3>
        <button onclick="loginAsAdmin()">Login as Admin</button>
        <button onclick="checkAuthStatus()">Check Auth Status</button>
        <button onclick="testAdminAPI()">Test Admin API</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="test-section">
        <h3>Test Results</h3>
        <div id="results" class="log">
            <p>Ready to test frontend admin functionality...</p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let accessToken = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            results.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            results.scrollTop = results.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function clearLog() {
            document.getElementById('results').innerHTML = '';
        }

        async function loginAsAdmin() {
            try {
                log('Getting CSRF token...');
                const csrfResponse = await fetch(`${API_BASE}/csrf/token`);
                const csrfData = await csrfResponse.json();
                
                log('Logging in as admin...');
                const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfData.csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'admin@ticketapp.com',
                        password: 'Admin123!'
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }

                const loginData = await loginResponse.json();
                accessToken = loginData.accessToken;
                
                // Store in sessionStorage like the Angular app does
                sessionStorage.setItem('accessToken', accessToken);
                localStorage.setItem('user', JSON.stringify(loginData.user));
                
                log(`✅ Login successful! User: ${loginData.user.email}, Role: ${loginData.user.role}`, 'success');
                log(`✅ Token stored in sessionStorage`, 'success');
                log(`✅ User stored in localStorage`, 'success');
                log(`🔗 Now open: http://localhost:4200/admin`, 'info');
                
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }

        async function checkAuthStatus() {
            const storedToken = sessionStorage.getItem('accessToken');
            const storedUser = localStorage.getItem('user');
            
            log('Checking authentication status...');
            log(`Token in sessionStorage: ${storedToken ? '✅ Present' : '❌ Missing'}`, storedToken ? 'success' : 'error');
            log(`User in localStorage: ${storedUser ? '✅ Present' : '❌ Missing'}`, storedUser ? 'success' : 'error');
            
            if (storedUser) {
                try {
                    const user = JSON.parse(storedUser);
                    log(`User details: ${user.email} (${user.role})`, 'info');
                } catch (e) {
                    log(`❌ Error parsing user data: ${e.message}`, 'error');
                }
            }
        }

        async function testAdminAPI() {
            const token = sessionStorage.getItem('accessToken');
            if (!token) {
                log('❌ No token found. Please login first.', 'error');
                return;
            }

            try {
                log('Testing admin dashboard API...');
                const response = await fetch(`${API_BASE}/admin/dashboard/stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const data = await response.json();
                log(`✅ Admin API working! Total users: ${data.overview.totalUsers}, Total events: ${data.overview.totalEvents}`, 'success');
                
            } catch (error) {
                log(`❌ Admin API error: ${error.message}`, 'error');
            }
        }

        // Auto-check auth status on page load
        window.addEventListener('load', () => {
            checkAuthStatus();
        });
    </script>
</body>
</html>
