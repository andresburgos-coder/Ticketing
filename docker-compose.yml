services:
  postgres:
    image: postgres:15-alpine
    container_name: ticket-db
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
      POSTGRES_DB: ticket_sales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_sales"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ticket-backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ticket_user
      DATABASE_PASSWORD: ticket_pass
      DATABASE_NAME: ticket_sales
      JWT_SECRET: your-secret-key-change-in-production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_EXTERNAL_URL: http://127.0.0.1:9001
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-network
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ticket-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - ticket-network
    command: npm run start -- --host 0.0.0.0

  test-db:
    image: postgres:15-alpine
    container_name: ticket-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: ticket_sales_test
    ports:
      - "5433:5432"
    networks:
      - ticket-network
    profiles:
      - test

  # Almacenamiento de imágenes - MinIO (Compatible S3)
  minio:
    image: minio/minio:latest
    container_name: ticketing-storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"      # API endpoint
      - "9001:9001"      # Console Web UI
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Servicio alternativo: Servidor de archivos simple con Node.js
  file-server:
    build:
      context: ./file-server
      dockerfile: Dockerfile
    container_name: ticketing-file-server
    environment:
      NODE_ENV: production
      PORT: 3001
      UPLOAD_DIR: /uploads
    ports:
      - "3001:3001"
    volumes:
      - file_uploads:/uploads
      - ./file-server/server.js:/app/server.js
    networks:
      - ticket-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ticket-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  file_uploads:
