# SonarQube Cloud Configuration - Ticketing System
# ================================================

# Project Information
sonar.projectName=Ticketing System
sonar.projectVersion=1.0.0

# Source Code
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/mock/**,**/migrations/**

# Test Exclusions
sonar.test.exclusions=**/*.spec.ts,**/*.test.ts

# Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Language
sonar.sourceEncoding=UTF-8

# Backend Specific
sonar.sources.backend=backend/src
sonar.tests.backend=backend/test

# Frontend Specific
sonar.sources.frontend=frontend/src
sonar.tests.frontend=frontend/src

# Code Duplication
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

# Analysis Parameters
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
